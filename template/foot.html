</section>
</main>

  <p><strong>Confidential — Planet Detroit internal.</strong> Please don't forward the link or password.</p>
  <p>Rebuilt from PRD.md and ROADMAP.md on BUILD_DATE.</p>
</footer>
<script>
// Build an "On this page" table of contents at the top of each document,
// linking to every h2/h3 heading (pandoc gives each heading a stable id).
document.querySelectorAll("section.doc").forEach(function (sec) {
  var heads = sec.querySelectorAll("h2[id], h3[id]");
  if (!heads.length) return;
  var esc = function (s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  };
  var out = [];
  var inSub = false;
  heads.forEach(function (h) {
    var link = '<a href="#' + h.id + '">' + esc(h.textContent) + "</a>";
    if (h.tagName === "H2") {
      if (inSub) { out.push("</ol></li>"); inSub = false; }
      else if (out.length) { out.push("</li>"); }
      out.push("<li>" + link);
    } else if (out.length) {
      if (!inSub) { out.push("<ol>"); inSub = true; }
      out.push("<li>" + link + "</li>");
    }
  });
  if (inSub) out.push("</ol></li>");
  else if (out.length) out.push("</li>");
  var toc = document.createElement("nav");
  toc.className = "toc";
  toc.setAttribute("aria-label", "Contents");
  toc.innerHTML = '<p class="toc-title">On this page</p><ol>' + out.join("") + "</ol>";
  var firstH2 = sec.querySelector("h2");
  if (firstH2) firstH2.parentNode.insertBefore(toc, firstH2);
  else sec.appendChild(toc);
});
// External links open in a new window so readers keep their place on the unlocked page.
document.querySelectorAll("main a[href]").forEach(function (a) {
  if (a.host && a.host !== location.host) { a.target = "_blank"; a.rel = "noopener"; }
});
// Collapsible sections: every h2 (and each h3 inside it) folds shut. Headings
// keep their pandoc ids, so the TOC and #links still work — navigation
// auto-expands whatever it points into.
function foldLevel(container, tag, cls) {
  var kids = Array.prototype.slice.call(container.children);
  var body = null;
  kids.forEach(function (n) {
    if (n.tagName === tag) {
      var det = document.createElement("details");
      det.className = "sec" + cls;
      var sum = document.createElement("summary");
      container.insertBefore(det, n);
      sum.appendChild(n);
      det.appendChild(sum);
      body = document.createElement("div");
      det.appendChild(body);
    } else if (body) {
      body.appendChild(n);
    }
  });
}
document.querySelectorAll("section.doc").forEach(function (sec) {
  foldLevel(sec, "H2", "");
  sec.querySelectorAll("details.sec > div").forEach(function (b) { foldLevel(b, "H3", " sub"); });
  var ctl = document.createElement("div");
  ctl.className = "expand-controls";
  ctl.innerHTML = '<button type="button" data-x="1">Expand all</button><button type="button" data-x="0">Collapse all</button>';
  ctl.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    sec.querySelectorAll("details.sec").forEach(function (d) { d.open = b.dataset.x === "1"; });
  });
  var toc = sec.querySelector("nav.toc");
  if (toc) toc.parentNode.insertBefore(ctl, toc.nextSibling);
  else sec.insertBefore(ctl, sec.firstChild);
});
function openTo(id) {
  var el = id && document.getElementById(id);
  if (!el) return;
  var d = el.closest("details");
  while (d) { d.open = true; d = d.parentElement ? d.parentElement.closest("details") : null; }
  el.scrollIntoView();
}
window.addEventListener("hashchange", function () { openTo(decodeURIComponent(location.hash.slice(1))); });
document.addEventListener("click", function (e) {
  var a = e.target.closest('a[href^="#"]');
  if (a) setTimeout(function () { openTo(decodeURIComponent(a.getAttribute("href").slice(1))); }, 0);
});
if (location.hash) openTo(decodeURIComponent(location.hash.slice(1)));
</script>
